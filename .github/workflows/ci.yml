name: CI

# Local-only CI: every job runs on the Owner's self-hosted Windows runner.
# This repository is PUBLIC, so triggers are restricted to the default branch
# and manual dispatch: a self-hosted runner must never execute untrusted code
# from pull requests. The runner label set includes the exact repository name.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  lint-and-smoke:
    name: Lint and smoke test (self-hosted Windows)
    runs-on: [self-hosted, Windows, X64, advanced-ai-video-processor]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv-ci

      - name: Install dependencies
        run: |
          .\.venv-ci\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-ci\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (fatal pyflakes errors only)
        # Full style lint still reports 16 cosmetic findings in app/ (see CICD-AUDIT.md).
        # This gate fails only on real defects: syntax errors and undefined names.
        run: .\.venv-ci\Scripts\python.exe -m flake8 --select=E9,F63,F7,F82 app

      - name: Smoke test (import app and render home page)
        run: |
          Push-Location app
          try {
            ..\.venv-ci\Scripts\python.exe -c "import main; client = main.app.test_client(); resp = client.get('/'); print('GET / ->', resp.status_code); assert resp.status_code == 200"
          }
          finally {
            Pop-Location
          }
